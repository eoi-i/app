name: CI/CD
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: تحقق من وجود قاعدة الاختبار
        run: |
          if [ -z "${{ secrets.TEST_DATABASE_URL }}" ]; then echo "::error::أضف Secret باسم TEST_DATABASE_URL (قاعدة اختبار منفصلة)"; exit 1; fi
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: تشغيل اختبارات SQL (داخل معاملة تُلغى)
        env:
          DB: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          set +e
          OUT=$(psql "$DB" -v ON_ERROR_STOP=0 -f tests/sql/integration.sql 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "RESULT" || { echo "::error::لم تصدر النتيجة"; exit 1; }
          if echo "$OUT" | grep -q "^FAIL"; then echo "::error::فشل اختبار تكامل"; exit 1; fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: test-results/ }

  deploy:
    needs: [unit, integration, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build
      - name: نشر على Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  load-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - run: k6 run k6/api-load.js
        env:
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          ANON_KEY: ${{ secrets.TEST_ANON_KEY }}
          EMAIL: ${{ secrets.TEST_EMAIL }}
          PASSWORD: ${{ secrets.TEST_PASSWORD }}